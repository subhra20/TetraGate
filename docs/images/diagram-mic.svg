<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" width="1240" height="660" role="img" aria-label="Message integrity check"><title>Message integrity check</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke" stroke="none"/></marker><marker id="ahx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="dot" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="6" markerHeight="6"><circle cx="3" cy="3" r="2.4" fill="#0f172a"/></marker></defs><rect width="1240" height="660" fill="#ffffff"/><text x="40" y="46" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="23" fill="#0f172a" text-anchor="start" font-weight="700" >How a frame is signed and checked</text><text x="40" y="70" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="400" >One master key on every device; a different key per node, derived and never stored</text><line x1="40" y1="86" x2="1200" y2="86" stroke="#cbd5e1" stroke-width="1" /><rect x="50" y="120" width="250" height="104" rx="10" fill="#f8fafc" stroke="#8b5cf6" stroke-width="2" /><rect x="50" y="120" width="250" height="26" rx="10" fill="#8b5cf6" stroke="none" stroke-width="1.4" /><rect x="50" y="136" width="250" height="10" rx="0" fill="#8b5cf6" stroke="none" stroke-width="1.4" /><text x="62" y="138" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="700" >Master key</text><text x="62" y="168" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >16 bytes, random</text><text x="62" y="186" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >lora_keys.h</text><text x="62" y="204" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >identical everywhere</text><path d="M300 172 H380" fill="none" stroke="#8b5cf6" stroke-width="2.6" marker-end="url(#ah)"/><rect x="380" y="130" width="250" height="84" rx="10" fill="#1e293b" stroke="#0f172a" stroke-width="2" /><text x="505" y="160" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="13" fill="#ffffff" text-anchor="middle" font-weight="700" >AES-128-CMAC</text><text x="505" y="182" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="400" >"LGW1" || node_id</text><text x="505" y="200" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10" fill="#64748b" text-anchor="middle" font-weight="400" >(16-byte message)</text><path d="M630 172 H710" fill="none" stroke="#8b5cf6" stroke-width="2.6" marker-end="url(#ah)"/><rect x="710" y="120" width="250" height="104" rx="10" fill="#f8fafc" stroke="#8b5cf6" stroke-width="2" /><rect x="710" y="120" width="250" height="26" rx="10" fill="#8b5cf6" stroke="none" stroke-width="1.4" /><rect x="710" y="136" width="250" height="10" rx="0" fill="#8b5cf6" stroke="none" stroke-width="1.4" /><text x="722" y="138" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="700" >Node key</text><text x="722" y="168" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >unique per node id</text><text x="722" y="186" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >recomputed each time</text><text x="722" y="204" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >never written to flash</text><text x="50" y="280" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700" >Node side</text><text x="640" y="280" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700" >Gateway side</text><line x1="620" y1="262" x2="620" y2="560" stroke="#cbd5e1" stroke-width="1.4" stroke-dasharray="6 6" /><rect x="50" y="300" width="520" height="40" rx="8" fill="#f8fafc" stroke="#3b9eff" stroke-width="1.6" /><circle cx="74" cy="320" r="11" fill="#3b9eff" stroke="none" stroke-width="1"/><text x="74" y="324" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" >1</text><text x="96" y="325" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="400" >build the 14-byte body</text><path d="M310 340 V352" fill="none" stroke="#3b9eff" stroke-width="2" marker-end="url(#ah)"/><rect x="50" y="352" width="520" height="40" rx="8" fill="#f8fafc" stroke="#8b5cf6" stroke-width="1.6" /><circle cx="74" cy="372" r="11" fill="#8b5cf6" stroke="none" stroke-width="1"/><text x="74" y="376" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" >2</text><text x="96" y="377" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="400" >CMAC(K_node, body)</text><path d="M310 392 V404" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#ah)"/><rect x="50" y="404" width="520" height="40" rx="8" fill="#f8fafc" stroke="#8b5cf6" stroke-width="1.6" /><circle cx="74" cy="424" r="11" fill="#8b5cf6" stroke="none" stroke-width="1"/><text x="74" y="428" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" >3</text><text x="96" y="429" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="400" >append first 4 bytes</text><path d="M310 444 V456" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#ah)"/><rect x="50" y="456" width="520" height="40" rx="8" fill="#f8fafc" stroke="#2563eb" stroke-width="1.6" /><circle cx="74" cy="476" r="11" fill="#2563eb" stroke="none" stroke-width="1"/><text x="74" y="480" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" >4</text><text x="96" y="481" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="400" >set bit 7 of the type</text><path d="M310 496 V508" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#ah)"/><rect x="50" y="508" width="520" height="40" rx="8" fill="#f8fafc" stroke="#f59e0b" stroke-width="1.6" /><circle cx="74" cy="528" r="11" fill="#f59e0b" stroke="none" stroke-width="1"/><text x="74" y="532" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" >5</text><text x="96" y="533" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="400" >transmit 18 bytes</text><rect x="640" y="300" width="560" height="40" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.6" /><circle cx="664" cy="320" r="11" fill="#64748b" stroke="none" stroke-width="1"/><text x="664" y="324" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" >1</text><text x="686" y="325" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="400" >bit 7 set?  no -&gt; count no_mic</text><path d="M920 340 V352" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/><rect x="640" y="352" width="560" height="40" rx="8" fill="#f8fafc" stroke="#8b5cf6" stroke-width="1.6" /><circle cx="664" cy="372" r="11" fill="#8b5cf6" stroke="none" stroke-width="1"/><text x="664" y="376" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" >2</text><text x="686" y="377" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="400" >derive K_node from the claimed id</text><path d="M920 392 V404" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#ah)"/><rect x="640" y="404" width="560" height="40" rx="8" fill="#f8fafc" stroke="#8b5cf6" stroke-width="1.6" /><circle cx="664" cy="424" r="11" fill="#8b5cf6" stroke="none" stroke-width="1"/><text x="664" y="428" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" >3</text><text x="686" y="429" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="400" >CMAC over the body again</text><path d="M920 444 V456" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#ah)"/><rect x="640" y="456" width="560" height="40" rx="8" fill="#f8fafc" stroke="#8b5cf6" stroke-width="1.6" /><circle cx="664" cy="476" r="11" fill="#8b5cf6" stroke="none" stroke-width="1"/><text x="664" y="480" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" >4</text><text x="686" y="481" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11.5" fill="#0f172a" text-anchor="start" font-weight="400" >compare, byte by byte</text><path d="M920 496 V508" fill="none" stroke="#8b5cf6" stroke-width="2" marker-end="url(#ah)"/><rect x="640" y="508" width="560" height="40" rx="8" fill="#f8fafc" stroke="#16a34a" stroke-width="1.6" /><circle cx="664" cy="528" r="11" fill="#16a34a" stroke="none" stroke-width="1"/><text x="664" y="532" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" >5</text><text x="686" y="533" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11.5" fill="#166534" text-anchor="start" font-weight="400" >match -&gt; accept     differ -&gt; DROP</text><rect x="50" y="572" width="1150" height="70" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.4" /><text x="70" y="598" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="13" fill="#9a3412" text-anchor="start" font-weight="700" >What this does and does not buy you</text><text x="70" y="622" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#7c2d12" text-anchor="start" font-weight="400" >Nobody can forge a reading from your node without the master key. The payload is still plaintext - the MIC proves who sent it, it does not hide it. A frame replayed within the same sequence wrap still verifies.</text></svg>