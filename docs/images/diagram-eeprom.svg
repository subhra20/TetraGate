<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" width="1240" height="620" role="img" aria-label="EEPROM layout"><title>EEPROM layout</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke" stroke="none"/></marker><marker id="ahx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="dot" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="6" markerHeight="6"><circle cx="3" cy="3" r="2.4" fill="#0f172a"/></marker></defs><rect width="1240" height="620" fill="#ffffff"/><text x="40" y="46" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="23" fill="#0f172a" text-anchor="start" font-weight="700" >Configuration storage, and why there are two copies</text><text x="40" y="70" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="400" >AT24C256, 32 kB, on I2C1. Written rarely, read once at boot.</text><line x1="40" y1="86" x2="1200" y2="86" stroke="#cbd5e1" stroke-width="1" /><rect x="220" y="120" width="520" height="60" rx="8" fill="#64748b14" stroke="#64748b" stroke-width="1.8" /><text x="240" y="146" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700" >header</text><text x="240" y="168" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#64748b" text-anchor="start" font-weight="400" >boot count, reset reason, active slot</text><text x="206" y="144" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#64748b" text-anchor="end" font-weight="700" >0x0000</text><rect x="220" y="190" width="520" height="200" rx="8" fill="#2563eb14" stroke="#2563eb" stroke-width="1.8" /><text x="240" y="216" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700" >config slot A</text><text x="240" y="238" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#64748b" text-anchor="start" font-weight="400" >radio settings as JSON</text><text x="206" y="214" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#2563eb" text-anchor="end" font-weight="700" >0x0040</text><rect x="220" y="400" width="520" height="200" rx="8" fill="#2563eb14" stroke="#2563eb" stroke-width="1.8" /><text x="240" y="426" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700" >config slot B</text><text x="240" y="448" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#64748b" text-anchor="start" font-weight="400" >the previous good copy</text><text x="206" y="424" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#2563eb" text-anchor="end" font-weight="700" >0x1040</text><rect x="220" y="610" width="520" height="90" rx="8" fill="#f59e0b14" stroke="#f59e0b" stroke-width="1.8" /><text x="240" y="636" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700" >touch calibration</text><text x="240" y="658" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#64748b" text-anchor="start" font-weight="400" >four corner points</text><text x="206" y="634" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#f59e0b" text-anchor="end" font-weight="700" >0x3040</text><rect x="220" y="710" width="520" height="90" rx="8" fill="#16a34a14" stroke="#16a34a" stroke-width="1.8" /><text x="240" y="736" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700" >whitelist</text><text x="240" y="758" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#64748b" text-anchor="start" font-weight="400" >accepted node ids</text><text x="206" y="734" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#16a34a" text-anchor="end" font-weight="700" >0x3100</text><rect x="790" y="120" width="410" height="200" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4" /><text x="812" y="148" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700" >Why A and B</text><text x="812" y="174" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#64748b" text-anchor="start" font-weight="400" >A write that is interrupted - a reset, a</text><text x="812" y="191" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#64748b" text-anchor="start" font-weight="400" >brown-out, a pulled USB cable - leaves</text><text x="812" y="208" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#64748b" text-anchor="start" font-weight="400" >half a record behind.</text><text x="812" y="225" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#64748b" text-anchor="start" font-weight="400" ></text><text x="812" y="242" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#64748b" text-anchor="start" font-weight="400" >The new configuration goes into the</text><text x="812" y="259" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#64748b" text-anchor="start" font-weight="400" >inactive slot. Only when it reads back</text><text x="812" y="276" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#64748b" text-anchor="start" font-weight="400" >and validates does the header switch</text><text x="812" y="293" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#64748b" text-anchor="start" font-weight="400" >the active slot over.</text><text x="812" y="310" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#64748b" text-anchor="start" font-weight="400" ></text><text x="812" y="327" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#64748b" text-anchor="start" font-weight="400" >So the worst case is the previous</text><text x="812" y="344" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#64748b" text-anchor="start" font-weight="400" >configuration, never a broken one.</text><rect x="790" y="336" width="410" height="164" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.4" /><text x="812" y="364" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="14" fill="#9a3412" text-anchor="start" font-weight="700" >What is NOT stored</text><text x="812" y="390" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#7c2d12" text-anchor="start" font-weight="400" >The MIC policy. Fn_Radio_Set_Mic_Required()</text><text x="812" y="407" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#7c2d12" text-anchor="start" font-weight="400" >changes it at runtime and it resets to the</text><text x="812" y="424" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#7c2d12" text-anchor="start" font-weight="400" >compiled default on every boot.</text><text x="812" y="441" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#7c2d12" text-anchor="start" font-weight="400" ></text><text x="812" y="458" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#7c2d12" text-anchor="start" font-weight="400" >That is deliberate: switching to enforcing</text><text x="812" y="475" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#7c2d12" text-anchor="start" font-weight="400" >too early would lock every legacy node out,</text><text x="812" y="492" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#7c2d12" text-anchor="start" font-weight="400" >and a stored setting would survive the</text><text x="812" y="509" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#7c2d12" text-anchor="start" font-weight="400" >reboot you would reach for to undo it.</text><text x="50" y="580" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400" >Node count, radio statistics and the live node table are RAM only. They rebuild from traffic within one reporting interval, so there is nothing worth wearing out the EEPROM for.</text></svg>