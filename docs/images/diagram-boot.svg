<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" role="img" aria-label="Gateway boot sequence"><title>Gateway boot sequence</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke" stroke="none"/></marker><marker id="ahx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="dot" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="6" markerHeight="6"><circle cx="3" cy="3" r="2.4" fill="#0f172a"/></marker></defs><rect width="1240" height="700" fill="#ffffff"/><text x="40" y="46" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="23" fill="#0f172a" text-anchor="start" font-weight="700" >What happens between power-on and the first packet</text><text x="40" y="70" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="400" >Read along with Fn_Task_Taskinit() in Gateway/Core/Src/freertos.c</text><line x1="40" y1="86" x2="1200" y2="86" stroke="#cbd5e1" stroke-width="1" /><rect x="50" y="120" width="540" height="60" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.8" /><circle cx="78" cy="150" r="15" fill="#64748b" stroke="none" stroke-width="1"/><text x="78" y="155" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700" >1</text><text x="104" y="146" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700" >HAL_Init()</text><text x="104" y="165" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >flash latency, NVIC grouping</text><path d="M320 180 V194" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/><rect x="50" y="194" width="540" height="60" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.8" /><circle cx="78" cy="224" r="15" fill="#64748b" stroke="none" stroke-width="1"/><text x="78" y="229" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700" >2</text><text x="104" y="220" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700" >SystemClock_Config()</text><text x="104" y="239" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >HSE 8 MHz -&gt; PLL -&gt; 168 MHz</text><path d="M320 254 V268" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/><rect x="50" y="268" width="540" height="60" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.8" /><circle cx="78" cy="298" r="15" fill="#64748b" stroke="none" stroke-width="1"/><text x="78" y="303" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700" >3</text><text x="104" y="294" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700" >MX_*_Init()</text><text x="104" y="313" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >GPIO, DMA, I2C1, SPI1-6, USART3, RTC</text><path d="M320 328 V342" fill="none" stroke="#64748b" stroke-width="2" marker-end="url(#ah)"/><rect x="50" y="342" width="540" height="60" rx="8" fill="#f8fafc" stroke="#2563eb" stroke-width="1.8" /><circle cx="78" cy="372" r="15" fill="#2563eb" stroke="none" stroke-width="1"/><text x="78" y="377" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700" >4</text><text x="104" y="368" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700" >MX_FREERTOS_Init()</text><text x="104" y="387" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >create 7 tasks, then start the scheduler</text><path d="M320 402 V416" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#ah)"/><rect x="50" y="416" width="540" height="60" rx="8" fill="#f8fafc" stroke="#2563eb" stroke-width="1.8" /><circle cx="78" cy="446" r="15" fill="#2563eb" stroke="none" stroke-width="1"/><text x="78" y="451" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700" >5</text><text x="104" y="442" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700" >TaskInit: subsystems</text><text x="104" y="461" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >JSON, EEPROM, packet ring, node table</text><path d="M320 476 V490" fill="none" stroke="#2563eb" stroke-width="2" marker-end="url(#ah)"/><rect x="50" y="490" width="540" height="60" rx="8" fill="#f8fafc" stroke="#2563eb" stroke-width="1.8" /><circle cx="78" cy="520" r="15" fill="#2563eb" stroke="none" stroke-width="1"/><text x="78" y="525" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700" >6</text><text x="104" y="516" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700" >TaskInit: boot record</text><text x="104" y="535" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >boot counter ++, reset reason stored</text><rect x="650" y="120" width="540" height="60" rx="8" fill="#f8fafc" stroke="#f59e0b" stroke-width="1.8" /><circle cx="678" cy="150" r="15" fill="#f59e0b" stroke="none" stroke-width="1"/><text x="678" y="155" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700" >7</text><text x="704" y="146" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700" >TaskInit: load config</text><text x="704" y="165" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >valid JSON in EEPROM? parse and validate</text><path d="M920 180 V194" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#ah)"/><rect x="650" y="194" width="540" height="60" rx="8" fill="#f8fafc" stroke="#f59e0b" stroke-width="1.8" /><circle cx="678" cy="224" r="15" fill="#f59e0b" stroke="none" stroke-width="1"/><text x="678" y="229" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700" >8</text><text x="704" y="220" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700" >TaskInit: or defaults</text><text x="704" y="239" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >no valid JSON -&gt; defaults, then write them back</text><path d="M920 254 V268" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#ah)"/><rect x="650" y="268" width="540" height="60" rx="8" fill="#f8fafc" stroke="#16a34a" stroke-width="1.8" /><circle cx="678" cy="298" r="15" fill="#16a34a" stroke="none" stroke-width="1"/><text x="678" y="303" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700" >9</text><text x="704" y="294" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700" >TaskInit: bring up radios</text><text x="704" y="313" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >reset, probe RegVersion, tune, set sync word</text><path d="M920 328 V342" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#ah)"/><rect x="650" y="342" width="540" height="60" rx="8" fill="#f8fafc" stroke="#16a34a" stroke-width="1.8" /><circle cx="678" cy="372" r="15" fill="#16a34a" stroke="none" stroke-width="1"/><text x="678" y="377" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700" >10</text><text x="704" y="368" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700" >TaskInit: report</text><text x="704" y="387" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >configuration and radio status out of USART3</text><path d="M920 402 V416" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#ah)"/><rect x="650" y="416" width="540" height="60" rx="8" fill="#f8fafc" stroke="#ef4444" stroke-width="1.8" /><circle cx="678" cy="446" r="15" fill="#ef4444" stroke="none" stroke-width="1"/><text x="678" y="451" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700" >11</text><text x="704" y="442" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700" >GUI init</text><text x="704" y="461" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >LVGL, touch calibration from EEPROM, six tabs</text><path d="M920 476 V490" fill="none" stroke="#ef4444" stroke-width="2" marker-end="url(#ah)"/><rect x="650" y="490" width="540" height="60" rx="8" fill="#f8fafc" stroke="#16a34a" stroke-width="1.8" /><circle cx="678" cy="520" r="15" fill="#16a34a" stroke="none" stroke-width="1"/><text x="678" y="525" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="700" >12</text><text x="704" y="516" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="12" fill="#0f172a" text-anchor="start" font-weight="700" >Monitor starts IWDG</text><text x="704" y="535" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >from here on, a stall reboots the board</text><path d="M590 490 H610 V150 H650" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/><rect x="50" y="572" width="1150" height="100" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.4" /><text x="70" y="598" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="13" fill="#9a3412" text-anchor="start" font-weight="700" >The boot line is the single most useful diagnostic</text><text x="70" y="622" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#7c2d12" text-anchor="start" font-weight="400" >If the GUI line never appears, Fn_GUI_Init() never returned. LV_USE_ASSERT_MALLOC turns an exhausted LVGL pool into an infinite loop, not an error -</text><text x="70" y="641" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#7c2d12" text-anchor="start" font-weight="400" >so the watchdog reboots the board every 8 s and the only evidence is the missing line. Raise LV_MEM_SIZE in lv_conf.h.</text><text x="70" y="660" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#7c2d12" text-anchor="start" font-weight="400" >The IWDG is deliberately NOT started in main(). If it were, a slow EEPROM or a stuck radio probe during init would reboot the board before it ever finished booting.</text></svg>