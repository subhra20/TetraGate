ize="10.5" fill="#a78bfa" text-anchor="middle" font-weight="400" >BW250</text><text x="429" y="422" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#a78bfa" text-anchor="middle" font-weight="400" >CR4/8</text><path d="M488 404 H560" fill="none" stroke="#a78bfa" stroke-width="2.6" marker-end="url(#ah)"/><text x="429" y="502" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#2dd4bf" text-anchor="middle" font-weight="400" >SF9</text><text x="429" y="518" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#2dd4bf" text-anchor="middle" font-weight="400" >BW250</text><text x="429" y="534" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#2dd4bf" text-anchor="middle" font-weight="400" >CR4/8</text><path d="M488 516 H560" fill="none" stroke="#2dd4bf" stroke-width="2.6" marker-end="url(#ah)"/><rect x="560" y="100" width="380" height="468" rx="12" fill="#0f172a" stroke="#0b1220" stroke-width="1.4" /><text x="750" y="130" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="15" fill="#ffffff" text-anchor="middle" font-weight="700" >GATEWAY</text><text x="750" y="150" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="400" >STM32F429ZI - FreeRTOS</text><rect x="580" y="166" width="150" height="40" rx="6" fill="#1e293b" stroke="#3b9eff" stroke-width="1.5" /><text x="592" y="190" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#e2e8f0" text-anchor="start" font-weight="400" >LoRa task 1</text><path d="M730 186 H770" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/><rect x="580" y="216" width="150" height="40" rx="6" fill="#1e293b" stroke="#f2a33c" stroke-width="1.5" /><text x="592" y="240" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#e2e8f0" text-anchor="start" font-weight="400" >LoRa task 2</text><path d="M730 236 H770" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/><rect x="580" y="266" width="150" height="40" rx="6" fill="#1e293b" stroke="#a78bfa" stroke-width="1.5" /><text x="592" y="290" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#e2e8f0" text-anchor="start" font-weight="400" >LoRa task 3</text><path d="M730 286 H770" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/><rect x="580" y="316" width="150" height="40" rx="6" fill="#1e293b" stroke="#2dd4bf" stroke-width="1.5" /><text x="592" y="340" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#e2e8f0" text-anchor="start" font-weight="400" >LoRa task 4</text><path d="M730 336 H770" fill="none" stroke="#475569" stroke-width="2" marker-end="url(#ah)"/><rect x="770" y="166" width="150" height="190" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" /><text x="782" y="190" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#e2e8f0" text-anchor="start" font-weight="700" >node_table.c</text><text x="782" y="242" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#94a3b8" text-anchor="start" font-weight="400" >de-duplicate</text><text x="782" y="268" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#94a3b8" text-anchor="start" font-weight="400" >MIC check</text><text x="782" y="294" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#94a3b8" text-anchor="start" font-weight="400" >learn interval</text><text x="782" y="320" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#94a3b8" text-anchor="start" font-weight="400" >silence watch</text><rect x="580" y="376" width="340" height="54" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" /><text x="592" y="398" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#e2e8f0" text-anchor="start" font-weight="700" >monitor task</text><text x="592" y="418" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="400" >feeds the 8 s watchdog, drives the uplink</text><rect x="580" y="442" width="340" height="54" rx="6" fill="#1e293b" stroke="#334155" stroke-width="1.5" /><text x="592" y="464" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#e2e8f0" text-anchor="start" font-weight="700" >LVGL task</text><text x="592" y="484" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="400" >repaints the visible tab every 400 ms</text><text x="750" y="528" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400" >EEPROM: config A/B + touch calibration</text><text x="750" y="548" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="middle" font-weight="400" >IWDG 8 s - any stalled task reboots the board</text><rect x="1000" y="150" width="200" height="120" rx="10" fill="#f8fafc" stroke="#ef4444" stroke-width="2" /><rect x="1000" y="150" width="200" height="26" rx="10" fill="#ef4444" stroke="none" stroke-width="1.4" /><rect x="1000" y="166" width="200" height="10" rx="0" fill="#ef4444" stroke="none" stroke-width="1.4" /><text x="1012" y="168" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="700" >TFT  (on device)</text><text x="1012" y="198" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >2.8" 320x240</text><text x="1012" y="216" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >six touch tabs</text><text x="1012" y="234" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >no PC needed</text><text x="1012" y="252" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >400 ms refresh</text><path d="M940 300 H970 V210 H1000" fill="none" stroke="#ef4444" stroke-width="2.6" marker-end="url(#ah)"/><rect x="1000" y="330" width="200" height="140" rx="10" fill="#f8fafc" stroke="#8b5cf6" stroke-width="2" /><rect x="1000" y="330" width="200" height="26" rx="10" fill="#8b5cf6" stroke="none" stroke-width="1.4" /><rect x="1000" y="346" width="200" height="10" rx="0" fill="#8b5cf6" stroke="none" stroke-width="1.4" /><text x="1012" y="348" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="700" >PC console</text><text x="1012" y="378" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >USART3 115200</text><text x="1012" y="396" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >JSON lines out</text><text x="1012" y="414" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >commands in</text><text x="1012" y="432" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >bridge + browser</text><text x="1012" y="450" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >charts, CSV, log</text><path d="M940 340 H970 V400 H1000" fill="none" stroke="#8b5cf6" stroke-width="2.6" marker-end="url(#ah)"/><text x="968" y="332" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="end" font-weight="400" >USART3</text><rect x="50" y="596" width="1150" height="150" rx="10" fill="#eef4ff" stroke="#bfd4ff" stroke-width="1.4" /><text x="70" y="622" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="13" fill="#1e3a8a" text-anchor="start" font-weight="700" >How to read this picture</text><text x="70" y="648" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#1e3a8a" text-anchor="start" font-weight="400" >Each node owns one frequency, and each gateway radio listens on exactly that frequency. Nothing is shared, so a node cannot collide with another node.</text><text x="70" y="672" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#1e3a8a" text-anchor="start" font-weight="400" >The four LoRa tasks are identical code running four times. A task only ever touches its own radio, which is why one dead module cannot take the others down.</text><text x="70" y="696" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#1e3a8a" text-anchor="start" font-weight="400" >Everything a task learns goes into one table behind one mutex. The TFT and the PC console are both readers of that table - they never talk to a radio directly.</text><text x="70" y="720" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#1e3a8a" text-anchor="start" font-weight="400" >The link is one-way. Nodes transmit and never listen, so the gateway has no way to answer them; configuration changes are made at the gateway, not pushed to nodes.</text></svg>