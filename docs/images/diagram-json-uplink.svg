<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" width="1240" height="760" role="img" aria-label="How a JSON line is produced"><title>How a JSON line is produced</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke" stroke="none"/></marker><marker id="ahx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="dot" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="6" markerHeight="6"><circle cx="3" cy="3" r="2.4" fill="#0f172a"/></marker></defs><rect width="1240" height="760" fill="#ffffff"/><text x="40" y="46" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="23" fill="#0f172a" text-anchor="start" font-weight="700" >How the JSON message is generated</text><text x="40" y="70" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="400" >Nothing on the radio link is JSON. The text is built on the gateway, from the binary frame, one line at a time.</text><line x1="40" y1="86" x2="1200" y2="86" stroke="#cbd5e1" stroke-width="1" /><text x="50" y="124" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700" >1.  the bytes that arrived</text><rect x="50" y="140" width="56" height="40" rx="5" fill="#2563eb18" stroke="#2563eb" stroke-width="1.6" /><text x="78" y="166" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700" >81</text><text x="78" y="196" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="9.5" fill="#2563eb" text-anchor="middle" font-weight="400" >type</text><rect x="112" y="140" width="56" height="40" rx="5" fill="#16a34a18" stroke="#16a34a" stroke-width="1.6" /><text x="140" y="166" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700" >EA</text><text x="140" y="196" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="9.5" fill="#16a34a" text-anchor="middle" font-weight="400" >node id</text><rect x="174" y="140" width="56" height="40" rx="5" fill="#16a34a18" stroke="#16a34a" stroke-width="1.6" /><text x="202" y="166" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700" >03</text><rect x="236" y="140" width="56" height="40" rx="5" fill="#f59e0b18" stroke="#f59e0b" stroke-width="1.6" /><text x="264" y="166" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700" >2C</text><text x="264" y="196" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="9.5" fill="#f59e0b" text-anchor="middle" font-weight="400" >seq</text><rect x="298" y="140" width="56" height="40" rx="5" fill="#0ea5e918" stroke="#0ea5e9" stroke-width="1.6" /><text x="326" y="166" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700" >D0</text><text x="326" y="196" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="9.5" fill="#0ea5e9" text-anchor="middle" font-weight="400" >temp</text><rect x="360" y="140" width="56" height="40" rx="5" fill="#0ea5e918" stroke="#0ea5e9" stroke-width="1.6" /><text x="388" y="166" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700" >07</text><rect x="422" y="140" width="56" height="40" rx="5" fill="#0ea5e918" stroke="#0ea5e9" stroke-width="1.6" /><text x="450" y="166" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700" >21</text><text x="450" y="196" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="9.5" fill="#0ea5e9" text-anchor="middle" font-weight="400" >hum</text><rect x="484" y="140" width="56" height="40" rx="5" fill="#0ea5e918" stroke="#0ea5e9" stroke-width="1.6" /><text x="512" y="166" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700" >19</text><rect x="546" y="140" width="56" height="40" rx="5" fill="#0ea5e918" stroke="#0ea5e9" stroke-width="1.6" /><text x="574" y="166" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700" >71</text><text x="574" y="196" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="9.5" fill="#0ea5e9" text-anchor="middle" font-weight="400" >batt</text><rect x="608" y="140" width="56" height="40" rx="5" fill="#0ea5e918" stroke="#0ea5e9" stroke-width="1.6" /><text x="636" y="166" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700" >0E</text><rect x="670" y="140" width="56" height="40" rx="5" fill="#0ea5e918" stroke="#0ea5e9" stroke-width="1.6" /><text x="698" y="166" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700" >5A</text><text x="698" y="196" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="9.5" fill="#0ea5e9" text-anchor="middle" font-weight="400" >uptime</text><rect x="732" y="140" width="56" height="40" rx="5" fill="#0ea5e918" stroke="#0ea5e9" stroke-width="1.6" /><text x="760" y="166" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700" >10</text><rect x="794" y="140" width="56" height="40" rx="5" fill="#0ea5e918" stroke="#0ea5e9" stroke-width="1.6" /><text x="822" y="166" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700" >00</text><rect x="856" y="140" width="56" height="40" rx="5" fill="#0ea5e918" stroke="#0ea5e9" stroke-width="1.6" /><text x="884" y="166" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="13" fill="#0f172a" text-anchor="middle" font-weight="700" >00</text><rect x="918" y="140" width="56" height="40" rx="5" fill="#8b5cf618" stroke="#8b5cf6" stroke-width="1.6" /><text x="946" y="166" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="13" fill="#64748b" text-anchor="middle" font-weight="700" >--</text><text x="946" y="196" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="9.5" fill="#8b5cf6" text-anchor="middle" font-weight="400" >MIC</text><rect x="980" y="140" width="56" height="40" rx="5" fill="#8b5cf618" stroke="#8b5cf6" stroke-width="1.6" /><text x="1008" y="166" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="13" fill="#64748b" text-anchor="middle" font-weight="700" >--</text><rect x="1042" y="140" width="56" height="40" rx="5" fill="#8b5cf618" stroke="#8b5cf6" stroke-width="1.6" /><text x="1070" y="166" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="13" fill="#64748b" text-anchor="middle" font-weight="700" >--</text><rect x="1104" y="140" width="56" height="40" rx="5" fill="#8b5cf618" stroke="#8b5cf6" stroke-width="1.6" /><text x="1132" y="166" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="13" fill="#64748b" text-anchor="middle" font-weight="700" >--</text><text x="50" y="244" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700" >2.  uplink.c reads each field at a fixed offset</text><rect x="50" y="258" width="700" height="148" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.4" /><text x="68" y="282" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#e2e8f0" text-anchor="start" font-weight="400" >u8Type   =  pu8Data[0] &amp; 0x7F;        /* 0x81 &amp; 0x7F = 0x01 data */</text><text x="68" y="303" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#e2e8f0" text-anchor="start" font-weight="400" >u16Node  =  pu8Data[1] | (pu8Data[2]&lt;&lt;8);   /* 0x03EA = 1002     */</text><text x="68" y="324" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#e2e8f0" text-anchor="start" font-weight="400" >u8Seq    =  pu8Data[3];                     /* 0x2C   = 44       */</text><text x="68" y="345" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#e2e8f0" text-anchor="start" font-weight="400" >i16Temp  =  pu8Data[4] | (pu8Data[5]&lt;&lt;8);   /* 0x07D0 = 20.00 C  */</text><text x="68" y="366" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#e2e8f0" text-anchor="start" font-weight="400" >u16Hum   =  pu8Data[6] | (pu8Data[7]&lt;&lt;8);   /* 0x1921 = 64.33 %  */</text><text x="68" y="387" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#e2e8f0" text-anchor="start" font-weight="400" >u16Batt  =  pu8Data[8] | (pu8Data[9]&lt;&lt;8);   /* 0x0E71 = 3697 mV  */</text><text x="790" y="244" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700" >3.  one snprintf, one static buffer</text><rect x="790" y="258" width="410" height="148" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4" /><text x="810" y="282" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >UP_BUF_BYTES is 1024 and the buffer</text><text x="810" y="298" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >is static - the calling tasks have 1 KB</text><text x="810" y="314" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >stacks, so a local one would overflow.</text><text x="810" y="330" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" ></text><text x="810" y="346" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >Every write checks the remaining room.</text><text x="810" y="362" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >A status line builds four radio objects</text><text x="810" y="378" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >in a loop and silently lost radio 4 when</text><text x="810" y="394" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >the buffer was 512 bytes.</text><text x="50" y="444" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700" >4.  the line that leaves USART3</text><rect x="50" y="458" width="1150" height="58" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.4" /><text x="68" y="482" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#86efac" text-anchor="start" font-weight="400" >{"type":"packet","radio":2,"node":1002,"seq":44,"len":18,"rssi":-36,"snr":11,"mic":"ok",</text><text x="68" y="502" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#86efac" text-anchor="start" font-weight="400" >  "frame":"data","temp_cc":2000,"hum_cp":6433,"batt_mv":3697,"uptime_s":4186,"t_ms":3293160}</text><text x="50" y="556" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="13" fill="#0f172a" text-anchor="start" font-weight="700" >5.  the bridge turns the line back into an object</text><rect x="50" y="570" width="560" height="96" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1.4" /><text x="68" y="594" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#e2e8f0" text-anchor="start" font-weight="400" >obj = json.loads(line)</text><text x="68" y="615" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#e2e8f0" text-anchor="start" font-weight="400" >STATE.add_packet(obj)   # ring + CSV row</text><text x="68" y="636" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#e2e8f0" text-anchor="start" font-weight="400" ># browser polls /api/state?since=N</text><text x="68" y="657" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#e2e8f0" text-anchor="start" font-weight="400" ># and draws the chart from what it gets</text><rect x="650" y="570" width="550" height="96" rx="8" fill="#ecfdf5" stroke="#86efac" stroke-width="1.4" /><text x="670" y="596" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="12.5" fill="#166534" text-anchor="start" font-weight="700" >Why integers, not floats</text><text x="670" y="618" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#14532d" text-anchor="start" font-weight="400" >temp_cc is centi-degrees: 2000 means 20.00 C.</text><text x="670" y="634" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#14532d" text-anchor="start" font-weight="400" >Scaling by 100 keeps the firmware free of printf float support,</text><text x="670" y="650" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#14532d" text-anchor="start" font-weight="400" >which costs several kB of flash and is easy to get wrong.</text><rect x="50" y="690" width="1150" height="56" rx="10" fill="#ffffff" stroke="#ffffff" stroke-width="1.4" /><text x="70" y="716" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="13" fill="#9a3412" text-anchor="start" font-weight="700" ></text><text x="50" y="706" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400" >The last four bytes are the MIC. They are verified and then discarded - the line reports the VERDICT ("mic":"ok"), never the MIC itself, so the value is shown as -- above.</text><text x="50" y="726" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400" >The same decoder runs for the TFT: gui_log.c reads the same bytes at the same offsets. Change one and you must change the other.</text></svg>