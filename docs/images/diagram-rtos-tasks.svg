<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 740" width="1240" height="740" role="img" aria-label="FreeRTOS task map"><title>FreeRTOS task map</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke" stroke="none"/></marker><marker id="ahx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="dot" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="6" markerHeight="6"><circle cx="3" cy="3" r="2.4" fill="#0f172a"/></marker></defs><rect width="1240" height="740" fill="#ffffff"/><text x="40" y="46" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="23" fill="#0f172a" text-anchor="start" font-weight="700" >Seven tasks, and what stops them colliding</text><text x="40" y="70" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="400" >CMSIS-RTOS v1 on FreeRTOS. Stack sizes are as declared in freertos.c (words x 4 = bytes).</text><line x1="40" y1="86" x2="1200" y2="86" stroke="#cbd5e1" stroke-width="1" /><rect x="50" y="116" width="420" height="50" rx="8" fill="#f8fafc" stroke="#64748b" stroke-width="1.8" /><rect x="50" y="116" width="5" height="50" rx="2" fill="#64748b" stroke="none" stroke-width="1.4" /><text x="68" y="137" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700" >TaskInit</text><text x="68" y="155" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >runs once, then deletes itself</text><text x="458" y="137" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#0f172a" text-anchor="end" font-weight="400" >AboveNormal</text><text x="458" y="155" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="end" font-weight="400" >2 KB</text><rect x="50" y="178" width="420" height="50" rx="8" fill="#f8fafc" stroke="#3b9eff" stroke-width="1.8" /><rect x="50" y="178" width="5" height="50" rx="2" fill="#3b9eff" stroke="none" stroke-width="1.4" /><text x="68" y="199" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700" >Task_LoRa_1</text><text x="68" y="217" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >owns radio 1 only</text><text x="458" y="199" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#0f172a" text-anchor="end" font-weight="400" >Normal</text><text x="458" y="217" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="end" font-weight="400" >1 KB</text><rect x="50" y="240" width="420" height="50" rx="8" fill="#f8fafc" stroke="#f2a33c" stroke-width="1.8" /><rect x="50" y="240" width="5" height="50" rx="2" fill="#f2a33c" stroke="none" stroke-width="1.4" /><text x="68" y="261" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700" >Task_LoRa_2</text><text x="68" y="279" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >owns radio 2 only</text><text x="458" y="261" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#0f172a" text-anchor="end" font-weight="400" >Normal</text><text x="458" y="279" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="end" font-weight="400" >1 KB</text><rect x="50" y="302" width="420" height="50" rx="8" fill="#f8fafc" stroke="#a78bfa" stroke-width="1.8" /><rect x="50" y="302" width="5" height="50" rx="2" fill="#a78bfa" stroke="none" stroke-width="1.4" /><text x="68" y="323" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700" >Task_LoRa_3</text><text x="68" y="341" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >owns radio 3 only</text><text x="458" y="323" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#0f172a" text-anchor="end" font-weight="400" >Normal</text><text x="458" y="341" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="end" font-weight="400" >1 KB</text><rect x="50" y="364" width="420" height="50" rx="8" fill="#f8fafc" stroke="#2dd4bf" stroke-width="1.8" /><rect x="50" y="364" width="5" height="50" rx="2" fill="#2dd4bf" stroke="none" stroke-width="1.4" /><text x="68" y="385" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700" >Task_LoRa_4</text><text x="68" y="403" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >owns radio 4 only</text><text x="458" y="385" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#0f172a" text-anchor="end" font-weight="400" >Normal</text><text x="458" y="403" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="end" font-weight="400" >1 KB</text><rect x="50" y="426" width="420" height="50" rx="8" fill="#f8fafc" stroke="#ef4444" stroke-width="1.8" /><rect x="50" y="426" width="5" height="50" rx="2" fill="#ef4444" stroke="none" stroke-width="1.4" /><text x="68" y="447" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700" >Task_LVGL</text><text x="68" y="465" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >draws the visible tab</text><text x="458" y="447" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#0f172a" text-anchor="end" font-weight="400" >Normal</text><text x="458" y="465" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="end" font-weight="400" >8 KB</text><rect x="50" y="488" width="420" height="50" rx="8" fill="#f8fafc" stroke="#22c55e" stroke-width="1.8" /><rect x="50" y="488" width="5" height="50" rx="2" fill="#22c55e" stroke="none" stroke-width="1.4" /><text x="68" y="509" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700" >Task_Monitor</text><text x="68" y="527" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >feeds the watchdog</text><text x="458" y="509" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#0f172a" text-anchor="end" font-weight="400" >Low</text><text x="458" y="527" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="end" font-weight="400" >1 KB</text><text x="540" y="108" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700" >Shared state, and its lock</text><rect x="540" y="124" width="320" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6" /><text x="558" y="148" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="12" fill="#334155" text-anchor="start" font-weight="700" >mtx_config</text><text x="558" y="167" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >the radio configuration struct</text><text x="558" y="184" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="400" >LoRa tasks, GUI, commands</text><rect x="540" y="210" width="320" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6" /><text x="558" y="234" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="12" fill="#334155" text-anchor="start" font-weight="700" >mtx_node</text><text x="558" y="253" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >the node table</text><text x="558" y="270" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="400" >LoRa tasks, GUI, uplink</text><rect x="540" y="296" width="320" height="70" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.6" /><text x="558" y="320" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="12" fill="#334155" text-anchor="start" font-weight="700" >sem_lora_uart</text><text x="558" y="339" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >USART3, one writer at a time</text><text x="558" y="356" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10" fill="#94a3b8" text-anchor="start" font-weight="400" >uplink + command replies</text><rect x="900" y="124" width="300" height="322" rx="10" fill="#052e16" stroke="#14532d" stroke-width="2" /><text x="1050" y="152" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="15" fill="#bbf7d0" text-anchor="middle" font-weight="700" >IWDG  8 s</text><text x="1050" y="174" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#86efac" text-anchor="middle" font-weight="400" >started by the monitor task</text><line x1="930" y1="190" x2="1170" y2="190" stroke="#14532d" stroke-width="1.2" /><text x="930" y="214" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#86efac" text-anchor="start" font-weight="400" >every task checks in with</text><text x="930" y="235" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#86efac" text-anchor="start" font-weight="400" >its own deadline</text><text x="930" y="256" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#000" text-anchor="start" font-weight="400" ></text><text x="930" y="277" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#86efac" text-anchor="start" font-weight="400" >a missed deadline sets a bit</text><text x="930" y="298" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#86efac" text-anchor="start" font-weight="400" >in u32StallMask</text><text x="930" y="319" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#000" text-anchor="start" font-weight="400" ></text><text x="930" y="340" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#86efac" text-anchor="start" font-weight="400" >the monitor stops feeding,</text><text x="930" y="361" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#86efac" text-anchor="start" font-weight="400" >the watchdog reboots,</text><text x="930" y="382" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#86efac" text-anchor="start" font-weight="400" >and the reason survives in</text><text x="930" y="403" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#86efac" text-anchor="start" font-weight="400" >the EEPROM header</text><path d="M470 240 H540" fill="none" stroke="#94a3b8" stroke-width="2" marker-end="url(#ah)"/><path d="M860 290 H900" fill="none" stroke="#22c55e" stroke-width="2" marker-end="url(#ah)"/><rect x="50" y="572" width="1150" height="140" rx="10" fill="#eef4ff" stroke="#bfd4ff" stroke-width="1.4" /><text x="70" y="598" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="13" fill="#1e3a8a" text-anchor="start" font-weight="700" >The rule that makes this safe</text><text x="70" y="622" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#1e3a8a" text-anchor="start" font-weight="400" >A LoRa task never touches another radio, and never draws anything. It reads its own SPI bus, verifies the MIC, and hands the result to the node table.</text><text x="70" y="641" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#1e3a8a" text-anchor="start" font-weight="400" >Everything else is a reader. That is why the GUI can be rewritten, or the PC console unplugged, without any risk to packet reception.</text><text x="70" y="660" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#1e3a8a" text-anchor="start" font-weight="400" ></text><text x="70" y="679" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#1e3a8a" text-anchor="start" font-weight="400" >The monitor task has a 1 KB stack and feeds the watchdog, so nothing it calls may block. That is why the uplink takes the UART semaphore with a 50 ms timeout</text><text x="70" y="698" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#1e3a8a" text-anchor="start" font-weight="400" >and drops the line rather than waiting - a dropped status line is survivable, a missed watchdog feed is a reboot.</text></svg>