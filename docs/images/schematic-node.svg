<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 560" width="1180" height="560" role="img" aria-label="TetraGate node interconnect schematic"><title>TetraGate node interconnect schematic</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke" stroke="none"/></marker><marker id="ahx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="dot" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="6" markerHeight="6"><circle cx="3" cy="3" r="2.4" fill="#0f172a"/></marker></defs><rect width="1180" height="560" fill="#ffffff"/><text x="40" y="46" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="24" fill="#0f172a" text-anchor="start" font-weight="700" >TetraGate Node (transmitter)</text><text x="40" y="70" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="400" >7Semi Anchor board  -  STM32G030F6P6 (TSSOP-20)  -  RFM95W  -  battery or USB powered</text><line x1="40" y1="86" x2="1140" y2="86" stroke="#cbd5e1" stroke-width="1" /><rect x="420" y="140" width="300" height="300" rx="12" fill="#1e293b" stroke="#0b1220" stroke-width="1.4" /><text x="570" y="176" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="17" fill="#ffffff" text-anchor="middle" font-weight="700" >STM32G030F6P6</text><text x="570" y="197" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="400" >Cortex-M0+  64 MHz</text><text x="570" y="214" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#94a3b8" text-anchor="middle" font-weight="400" >32 kB flash   8 kB RAM</text><line x1="450" y1="228" x2="690" y2="228" stroke="#334155" stroke-width="1" /><text x="570" y="252" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11.5" fill="#cbd5e1" text-anchor="middle" font-weight="400" >bare metal, no RTOS</text><text x="570" y="272" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11.5" fill="#cbd5e1" text-anchor="middle" font-weight="400" >SysTick 1 ms  -  IWDG 8 s</text><text x="570" y="292" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11.5" fill="#cbd5e1" text-anchor="middle" font-weight="400" >AES-128 CMAC in software</text><text x="570" y="312" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11.5" fill="#cbd5e1" text-anchor="middle" font-weight="400" >TX every 5 s, then standby</text><rect x="850" y="170" width="270" height="150" rx="10" fill="#f8fafc" stroke="#3b9eff" stroke-width="2" /><rect x="850" y="170" width="270" height="26" rx="10" fill="#3b9eff" stroke="none" stroke-width="1.4" /><rect x="850" y="186" width="270" height="10" rx="0" fill="#3b9eff" stroke="none" stroke-width="1.4" /><text x="862" y="188" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="12.5" fill="#ffffff" text-anchor="start" font-weight="700" >RFM95W  (SX1276)</text><text x="862" y="220" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="400" >SPI1  PA1 SCK</text><text x="862" y="239" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="400" >PA2 MOSI   PA6 MISO</text><text x="862" y="258" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="400" >NSS  PA5</text><text x="862" y="277" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#0f172a" text-anchor="start" font-weight="400" >RST  PA4</text><text x="862" y="296" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >DIO0 PB2  (not used)</text><line x1="1090" y1="298" x2="1090" y2="272" stroke="#3b9eff" stroke-width="2.2" /><path d="M1090 286 l7 -9 M1090 286 l-7 -9 M1090 278 l7 -9 M1090 278 l-7 -9" fill="none" stroke="#3b9eff" stroke-width="1.8" /><circle cx="1090" cy="298" r="2.6" fill="#3b9eff" stroke="none" stroke-width="1"/><path d="M720 245 H850" fill="none" stroke="#3b9eff" stroke-width="2.6" marker-end="url(#ah)"/><text x="785" y="233" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#3b9eff" text-anchor="middle" font-weight="400" >SPI1 + NSS/RST</text><rect x="60" y="140" width="290" height="92" rx="10" fill="#f8fafc" stroke="#f97316" stroke-width="2" /><rect x="60" y="140" width="290" height="24" rx="10" fill="#f97316" stroke="none" stroke-width="1.4" /><rect x="60" y="154" width="290" height="10" rx="0" fill="#f97316" stroke="none" stroke-width="1.4" /><text x="72" y="157" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="12" fill="#ffffff" text-anchor="start" font-weight="700" >Power</text><text x="72" y="182" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10" fill="#64748b" text-anchor="start" font-weight="400" >USB-C 5 V  or  LiPo</text><text x="72" y="199" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10" fill="#64748b" text-anchor="start" font-weight="400" >on-board 3V3 LDO</text><text x="72" y="216" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10" fill="#64748b" text-anchor="start" font-weight="400" >RFM95W peak 120 mA @ +17 dBm</text><path d="M350 186 H384 V210 H420" fill="none" stroke="#f97316" stroke-width="2.2" marker-end="url(#ah)" opacity="0.9"/><rect x="60" y="250" width="290" height="92" rx="10" fill="#f8fafc" stroke="#16a34a" stroke-width="2" /><rect x="60" y="250" width="290" height="24" rx="10" fill="#16a34a" stroke="none" stroke-width="1.4" /><rect x="60" y="264" width="290" height="10" rx="0" fill="#16a34a" stroke="none" stroke-width="1.4" /><text x="72" y="267" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="12" fill="#ffffff" text-anchor="start" font-weight="700" >Status LED</text><text x="72" y="292" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10" fill="#64748b" text-anchor="start" font-weight="400" >PA7  active high</text><text x="72" y="309" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10" fill="#64748b" text-anchor="start" font-weight="400" >1 blink  = TX ok</text><text x="72" y="326" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10" fill="#64748b" text-anchor="start" font-weight="400" >5 blinks = crypto self-test failed</text><path d="M350 296 H384 V300 H420" fill="none" stroke="#16a34a" stroke-width="2.2" marker-end="url(#ah)" opacity="0.9"/><rect x="60" y="360" width="290" height="92" rx="10" fill="#f8fafc" stroke="#8b5cf6" stroke-width="2" /><rect x="60" y="360" width="290" height="24" rx="10" fill="#8b5cf6" stroke="none" stroke-width="1.4" /><rect x="60" y="374" width="290" height="10" rx="0" fill="#8b5cf6" stroke="none" stroke-width="1.4" /><text x="72" y="377" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="12" fill="#ffffff" text-anchor="start" font-weight="700" >SWD header</text><text x="72" y="402" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10" fill="#64748b" text-anchor="start" font-weight="400" >PA13 SWDIO   PA14 SWCLK</text><text x="72" y="419" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10" fill="#64748b" text-anchor="start" font-weight="400" >ST-LINK V2 / V3</text><text x="72" y="436" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10" fill="#64748b" text-anchor="start" font-weight="400" >reads sNodeStats at 0x2000008C</text><path d="M350 406 H384 V390 H420" fill="none" stroke="#8b5cf6" stroke-width="2.2" marker-end="url(#ah)" opacity="0.9"/><rect x="60" y="470" width="1060" height="56" rx="8" fill="#f0f9ff" stroke="#7dd3fc" stroke-width="1.4" /><text x="76" y="494" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11.5" fill="#075985" text-anchor="start" font-weight="700" >NO SENSOR FITTED</text><text x="76" y="514" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#0c4a6e" text-anchor="start" font-weight="400" >Temperature, humidity and battery are generated by a UID-seeded random walk in node_packet.c, so each board produces a different but repeatable series. Swap that one function for a real driver and nothing else changes.</text></svg>