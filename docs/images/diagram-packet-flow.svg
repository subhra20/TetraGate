<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 700" width="1240" height="700" role="img" aria-label="Life of one packet"><title>Life of one packet</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke" stroke="none"/></marker><marker id="ahx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="dot" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="6" markerHeight="6"><circle cx="3" cy="3" r="2.4" fill="#0f172a"/></marker></defs><rect width="1240" height="700" fill="#ffffff"/><text x="40" y="46" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="23" fill="#0f172a" text-anchor="start" font-weight="700" >Life of one packet</text><text x="40" y="70" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="400" >The same reading, followed from the node's RAM to a chart in the browser - with the file that does each step</text><line x1="40" y1="86" x2="1200" y2="86" stroke="#cbd5e1" stroke-width="1" /><rect x="50" y="120" width="266" height="200" rx="10" fill="#f8fafc" stroke="#3b9eff" stroke-width="2" /><circle cx="76" cy="146" r="15" fill="#3b9eff" stroke="none" stroke-width="1"/><text x="76" y="151" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700" >1</text><text x="100" y="144" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700" >Node builds a frame</text><text x="100" y="162" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#3b9eff" text-anchor="start" font-weight="700" >node_packet.c</text><text x="66" y="196" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >Fn_Node_Packet_Build()</text><text x="66" y="218" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >14 bytes, little endian</text><text x="66" y="240" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >sequence++ every time</text><path d="M316 220 H346" fill="none" stroke="#3b9eff" stroke-width="2.6" marker-end="url(#ah)"/><rect x="346" y="120" width="266" height="200" rx="10" fill="#f8fafc" stroke="#8b5cf6" stroke-width="2" /><circle cx="372" cy="146" r="15" fill="#8b5cf6" stroke="none" stroke-width="1"/><text x="372" y="151" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700" >2</text><text x="396" y="144" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700" >Node signs it</text><text x="396" y="162" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#8b5cf6" text-anchor="start" font-weight="700" >lora_crypto.c</text><text x="362" y="196" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >K_node from node ID</text><text x="362" y="218" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >AES-128-CMAC</text><text x="362" y="240" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >first 4 bytes appended</text><path d="M612 220 H642" fill="none" stroke="#8b5cf6" stroke-width="2.6" marker-end="url(#ah)"/><rect x="642" y="120" width="266" height="200" rx="10" fill="#f8fafc" stroke="#f59e0b" stroke-width="2" /><circle cx="668" cy="146" r="15" fill="#f59e0b" stroke="none" stroke-width="1"/><text x="668" y="151" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700" >3</text><text x="692" y="144" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700" >Radio transmits</text><text x="692" y="162" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#f59e0b" text-anchor="start" font-weight="700" >LoRa.c</text><text x="658" y="196" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >SF9 BW250 CR4/8</text><text x="658" y="218" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >about 127 ms on air</text><text x="658" y="240" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >then back to standby</text><path d="M908 220 H938" fill="none" stroke="#f59e0b" stroke-width="2.6" marker-end="url(#ah)"/><rect x="938" y="120" width="266" height="200" rx="10" fill="#f8fafc" stroke="#f2a33c" stroke-width="2" /><circle cx="964" cy="146" r="15" fill="#f2a33c" stroke="none" stroke-width="1"/><text x="964" y="151" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700" >4</text><text x="988" y="144" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700" >Gateway radio hears it</text><text x="988" y="162" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#f2a33c" text-anchor="start" font-weight="700" >radio_manager.c</text><text x="954" y="196" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >polls RegIrqFlags</text><text x="954" y="218" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >reads RSSI and SNR</text><text x="954" y="240" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >CRC checked in hardware</text><path d="M1071 320 V356 H183 V388" fill="none" stroke="#f2a33c" stroke-width="2.6" marker-end="url(#ah)"/><rect x="50" y="388" width="266" height="200" rx="10" fill="#f8fafc" stroke="#8b5cf6" stroke-width="2" /><circle cx="76" cy="414" r="15" fill="#8b5cf6" stroke="none" stroke-width="1"/><text x="76" y="419" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700" >5</text><text x="100" y="412" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700" >MIC is verified</text><text x="100" y="430" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#8b5cf6" text-anchor="start" font-weight="700" >lora_crypto.c</text><text x="66" y="464" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >same key derived</text><text x="66" y="486" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >compare 4 bytes</text><text x="66" y="508" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >fail = dropped, always</text><path d="M316 488 H346" fill="none" stroke="#8b5cf6" stroke-width="2.6" marker-end="url(#ah)"/><rect x="346" y="388" width="266" height="200" rx="10" fill="#f8fafc" stroke="#a78bfa" stroke-width="2" /><circle cx="372" cy="414" r="15" fill="#a78bfa" stroke="none" stroke-width="1"/><text x="372" y="419" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700" >6</text><text x="396" y="412" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700" >Table is updated</text><text x="396" y="430" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#a78bfa" text-anchor="start" font-weight="700" >node_table.c</text><text x="362" y="464" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >duplicate? drop it</text><text x="362" y="486" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >learn the interval</text><text x="362" y="508" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >mark node alive</text><path d="M612 488 H642" fill="none" stroke="#a78bfa" stroke-width="2.6" marker-end="url(#ah)"/><rect x="642" y="388" width="266" height="200" rx="10" fill="#f8fafc" stroke="#2dd4bf" stroke-width="2" /><circle cx="668" cy="414" r="15" fill="#2dd4bf" stroke="none" stroke-width="1"/><text x="668" y="419" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700" >7</text><text x="692" y="412" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700" >Two readers wake up</text><text x="692" y="430" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#2dd4bf" text-anchor="start" font-weight="700" >gui_*.c / uplink.c</text><text x="658" y="464" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >TFT redraws the tab</text><text x="658" y="486" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >JSON line out of USART3</text><text x="658" y="508" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >50 ms timeout, never blocks</text><path d="M908 488 H938" fill="none" stroke="#2dd4bf" stroke-width="2.6" marker-end="url(#ah)"/><rect x="938" y="388" width="266" height="200" rx="10" fill="#f8fafc" stroke="#0ea5e9" stroke-width="2" /><circle cx="964" cy="414" r="15" fill="#0ea5e9" stroke="none" stroke-width="1"/><text x="964" y="419" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="14" fill="#ffffff" text-anchor="middle" font-weight="700" >8</text><text x="988" y="412" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="12.5" fill="#0f172a" text-anchor="start" font-weight="700" >PC console shows it</text><text x="988" y="430" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#0ea5e9" text-anchor="start" font-weight="700" >lora_bridge.py</text><text x="954" y="464" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >serial thread parses</text><text x="954" y="486" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >browser polls /api/state</text><text x="954" y="508" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="10.5" fill="#64748b" text-anchor="start" font-weight="400" >row appended to CSV</text><rect x="50" y="596" width="1150" height="76" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.4" /><text x="70" y="622" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="13" fill="#9a3412" text-anchor="start" font-weight="700" >The two steps that silently drop packets</text><text x="70" y="646" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#7c2d12" text-anchor="start" font-weight="400" >Step 5 drops any frame that claims a MIC and fails it - that is a forgery or a key mismatch, never a legacy node.</text><text x="70" y="664" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#7c2d12" text-anchor="start" font-weight="400" >Step 6 drops a repeat of the same node and sequence inside 4 s. A node whose sequence never advances is heard once and then ignored forever.</text></svg>