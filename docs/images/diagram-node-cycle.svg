<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 620" width="1240" height="620" role="img" aria-label="Node transmit cycle"><title>Node transmit cycle</title><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="context-stroke" stroke="none"/></marker><marker id="ahx" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#94a3b8"/></marker><marker id="ahb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563eb"/></marker><marker id="dot" viewBox="0 0 6 6" refX="3" refY="3" markerWidth="6" markerHeight="6"><circle cx="3" cy="3" r="2.4" fill="#0f172a"/></marker></defs><rect width="1240" height="620" fill="#ffffff"/><text x="40" y="46" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="23" fill="#0f172a" text-anchor="start" font-weight="700" >What a node does, every five seconds</text><text x="40" y="70" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="13" fill="#64748b" text-anchor="start" font-weight="400" >Bare metal, no RTOS. Node/Core/Src/main.c</text><line x1="40" y1="86" x2="1200" y2="86" stroke="#cbd5e1" stroke-width="1" /><circle cx="330" cy="160" r="30" fill="#64748b" stroke="none" stroke-width="1"/><text x="330" y="165" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" >wake</text><circle cx="462.911" cy="224.007" r="30" fill="#3b9eff" stroke="none" stroke-width="1"/><text x="462.911" y="229.007" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" >build</text><circle cx="495.738" cy="367.829" r="30" fill="#8b5cf6" stroke="none" stroke-width="1"/><text x="495.738" y="372.829" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" >sign</text><circle cx="403.76" cy="483.165" r="30" fill="#f59e0b" stroke="none" stroke-width="1"/><text x="403.76" y="488.165" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" >transmit</text><circle cx="256.24" cy="483.165" r="30" fill="#22c55e" stroke="none" stroke-width="1"/><text x="256.24" y="488.165" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" >blink</text><circle cx="164.262" cy="367.829" r="30" fill="#64748b" stroke="none" stroke-width="1"/><text x="164.262" y="372.829" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" >standby</text><circle cx="197.089" cy="224.007" r="30" fill="#16a34a" stroke="none" stroke-width="1"/><text x="197.089" y="229.007" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#ffffff" text-anchor="middle" font-weight="700" >feed</text><path d="M360.633 174.752 L428.675 207.519" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#ah)"/><path d="M470.477 257.154 L487.282 330.781" fill="none" stroke="#3b9eff" stroke-width="2.4" marker-end="url(#ah)"/><path d="M474.539 394.411 L427.453 453.455" fill="none" stroke="#8b5cf6" stroke-width="2.4" marker-end="url(#ah)"/><path d="M369.76 483.165 L294.24 483.165" fill="none" stroke="#f59e0b" stroke-width="2.4" marker-end="url(#ah)"/><path d="M235.041 456.582 L187.955 397.538" fill="none" stroke="#22c55e" stroke-width="2.4" marker-end="url(#ah)"/><path d="M171.828 334.681 L188.633 261.054" fill="none" stroke="#64748b" stroke-width="2.4" marker-end="url(#ah)"/><path d="M227.722 209.255 L295.763 176.488" fill="none" stroke="#16a34a" stroke-width="2.4" marker-end="url(#ah)"/><text x="330" y="324" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="20" fill="#0f172a" text-anchor="middle" font-weight="700" >5 s</text><text x="330" y="346" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="9.5" fill="#64748b" text-anchor="middle" font-weight="400" >DEF_NODE_TX_PERIOD_MS</text><rect x="600" y="120" width="600" height="180" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4" /><text x="622" y="148" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="14" fill="#0f172a" text-anchor="start" font-weight="700" >What each step costs</text><text x="622" y="178" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700" >time on air</text><text x="790" y="178" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#64748b" text-anchor="start" font-weight="400" >127 ms signed, 111 ms unsigned</text><text x="622" y="201" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700" >duty cycle</text><text x="790" y="201" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#64748b" text-anchor="start" font-weight="400" >roughly 2.5 % - above the 1 % ETSI limit</text><text x="622" y="224" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700" >peak current</text><text x="790" y="224" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#64748b" text-anchor="start" font-weight="400" >about 120 mA at +17 dBm</text><text x="622" y="247" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700" >every 10th frame</text><text x="790" y="247" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#64748b" text-anchor="start" font-weight="400" >a short status frame instead of data</text><text x="622" y="270" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#0f172a" text-anchor="start" font-weight="700" >sequence</text><text x="790" y="270" font-family="ui-monospace,'Cascadia Mono','Consolas','DejaVu Sans Mono',monospace" font-size="11" fill="#64748b" text-anchor="start" font-weight="400" >increments every frame, wraps at 255</text><rect x="600" y="320" width="600" height="150" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1.4" /><text x="620" y="346" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="13" fill="#9a3412" text-anchor="start" font-weight="700" >Two things to know before deploying</text><text x="620" y="370" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#7c2d12" text-anchor="start" font-weight="400" >The 2.5 % duty cycle is fine on a bench and NOT fine on a</text><text x="620" y="389" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#7c2d12" text-anchor="start" font-weight="400" >European 868 MHz deployment. Raise DEF_NODE_TX_PERIOD_MS</text><text x="620" y="408" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#7c2d12" text-anchor="start" font-weight="400" >to 12 s or more, or drop to SF7, before this leaves the lab.</text><text x="620" y="427" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#7c2d12" text-anchor="start" font-weight="400" ></text><text x="620" y="446" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#7c2d12" text-anchor="start" font-weight="400" >The sequence number must advance every frame, or the gateway</text><text x="620" y="465" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#7c2d12" text-anchor="start" font-weight="400" >treats every report after the first as a duplicate.</text><text x="50" y="560" font-family="'Segoe UI',Inter,system-ui,-apple-system,sans-serif" font-size="11.5" fill="#64748b" text-anchor="start" font-weight="400" >There is no receive path on the node. It transmits and goes back to standby, which is why the gateway cannot acknowledge, reconfigure or address a node.</text></svg>